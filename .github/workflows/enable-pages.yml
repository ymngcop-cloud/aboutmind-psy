name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from the default branch root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if gh api "repos/${REPO}/pages" >/tmp/pages.json 2>/tmp/pages.err; then
            echo "Pages already exists; updating source to main:/"
            gh api --method PUT "repos/${REPO}/pages" \
              -f build_type=legacy \
              -f "source[branch]=main" \
              -f "source[path]=/"
          else
            echo "Creating Pages site from main:/"
            cat /tmp/pages.err
            gh api --method POST "repos/${REPO}/pages" \
              -f build_type=legacy \
              -f "source[branch]=main" \
              -f "source[path]=/"
          fi
          gh api "repos/${REPO}/pages" --jq '{html_url,status,build_type,public,source}'
